<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThermoTech classifier — test harness</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --paper:#e6ebef; --panel:#fff; --ink:#14202b; --muted:#5c6b78;
    --line:#c7d1d9; --line-soft:#dde4ea;
    --persistent:#8a6a17; --abnormal:#b32317; --other:#3f6e72;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--paper); color:var(--ink);
    font-size:14px; line-height:1.45;
    font-variant-numeric: tabular-nums;
    display:flex; flex-direction:column;
  }
  header {
    display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
    padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  h1 { font-size:17px; font-weight:600; margin:0; letter-spacing:-.01em; }
  header .sub { color:var(--muted); font-size:13px; }
  .badge {
    margin-left:auto; padding:4px 10px; border:1px solid var(--line);
    border-radius:2px; font-size:12.5px; color:var(--muted); background:#f4f7f9;
  }
  .badge b { color:var(--ink); font-weight:600; }
  .badge.provisional { border-color:#d9b48a; background:#fdf5eb; color:#7a5320; }

  main { flex:1; display:flex; min-height:0; }
  #map { flex:1; min-width:0; background:#dbe3e9; }
  aside {
    width:400px; flex-shrink:0; background:var(--panel);
    border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0;
  }

  .filters { display:flex; border-bottom:1px solid var(--line); }
  .filters button {
    flex:1; padding:10px 6px; background:none; border:0; border-right:1px solid var(--line-soft);
    font:inherit; color:var(--muted); cursor:pointer; text-align:left; padding-left:12px;
    border-top:3px solid transparent;
  }
  .filters button:last-child { border-right:0; }
  .filters button:hover { background:#f4f7f9; }
  .filters button[aria-pressed="true"] { color:var(--ink); background:#f4f7f9; }
  .filters button[aria-pressed="true"].f-persistent { border-top-color:var(--persistent); }
  .filters button[aria-pressed="true"].f-abnormal   { border-top-color:var(--abnormal); }
  .filters button[aria-pressed="true"].f-other      { border-top-color:var(--other); }
  .filters .n { display:block; font-size:19px; font-weight:600; color:var(--ink); }
  .filters .lbl { font-size:11.5px; }

  #list { overflow-y:auto; flex:1; }
  .row {
    padding:11px 14px 11px 12px; border-bottom:1px solid var(--line-soft);
    cursor:pointer; display:grid; grid-template-columns:8px 1fr auto; gap:10px; align-items:baseline;
  }
  .row:hover, .row.sel { background:#f4f7f9; }
  .row.sel { border-left:3px solid var(--ink); padding-left:9px; }
  .dot { width:8px; height:8px; border-radius:50%; align-self:center; }
  .row .name { font-weight:600; font-size:13.5px; }
  .row .meta { color:var(--muted); font-size:12.5px; }
  .row .conf { color:var(--muted); font-size:12.5px; text-align:right; }

  .detail { grid-column:1/-1; padding-top:10px; cursor:auto; }
  .detail p { margin:0 0 12px; font-size:13px; }
  .factor { margin-bottom:9px; }
  .factor .fl { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; }
  .factor .fl span:last-child { color:var(--muted); flex-shrink:0; }
  .bar { height:5px; background:var(--line-soft); margin-top:3px; position:relative; }
  .bar i { position:absolute; top:0; bottom:0; }
  .bar i.pos { background:var(--abnormal); left:50%; }
  .bar i.neg { background:var(--muted); right:50%; }
  table.raw { width:100%; border-collapse:collapse; margin-top:12px; font-size:12.5px; }
  table.raw td { padding:3px 0; border-bottom:1px solid var(--line-soft); color:var(--muted); }
  table.raw td:last-child { text-align:right; color:var(--ink); }
  .note { color:var(--muted); font-size:12.5px; padding:14px; }
  .empty { padding:24px 14px; color:var(--muted); }
  @media (max-width:820px) {
    main { flex-direction:column; } aside { width:auto; border-left:0; border-top:1px solid var(--line); }
    #map { height:44vh; flex:none; }
  }
</style>
</head>
<body>
<header>
  <h1>ThermoTech classifier</h1>
  <span class="sub">Local test harness — sample FIRMS hotspots, 5–7 Sep 2026</span>
  <span class="badge" id="badge">Loading</span>
</header>

<main>
  <div id="map"></div>
  <aside>
    <div class="filters" id="filters"></div>
    <div id="list"><div class="empty">Classifying hotspots…</div></div>
  </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLOR = {
  PERSISTENT_SOURCE: getComputedStyle(document.documentElement).getPropertyValue('--persistent').trim(),
  NEW_ABNORMAL_EVENT: getComputedStyle(document.documentElement).getPropertyValue('--abnormal').trim(),
  OTHER_ANOMALY: getComputedStyle(document.documentElement).getPropertyValue('--other').trim(),
};
const SHORT = {
  PERSISTENT_SOURCE: 'Persistent source',
  NEW_ABNORMAL_EVENT: 'New abnormal event',
  OTHER_ANOMALY: 'Other anomaly',
};
const ORDER = ['NEW_ABNORMAL_EVENT', 'PERSISTENT_SOURCE', 'OTHER_ANOMALY'];

let data = [], active = new Set(ORDER), selected = null, markers = {};

const map = L.map('map', { zoomControl: true }).setView([21.5, 79], 5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap, &copy; CARTO', maxZoom: 18
}).addTo(map);

fetch('/api/hotspots').then(r => r.json()).then(payload => {
  if (payload.error) { document.getElementById('list').innerHTML =
    '<div class="empty">' + payload.error + '</div>'; return; }
  data = payload.hotspots;
  showBadge(payload.model);
  drawFilters(payload.counts);
  drawMarkers();
  drawList();
}).catch(e => {
  document.getElementById('list').innerHTML =
    '<div class="empty">Could not reach the server. Start it with ' +
    '<code>python -m uvicorn demo.app:app --reload</code> from the ml folder.</div>';
});

function showBadge(m) {
  const b = document.getElementById('badge');
  if (m.trained && m.validated === false) {
    b.className = 'badge provisional';
    b.innerHTML = 'Bootstrap model — trained on <b>rule labels</b>, not human review. ' +
      'Not a performance figure.';
  } else if (m.trained) {
    b.innerHTML = 'Trained model <b>xgboost-1</b>' +
      (m.macro_f1 ? ' · macro F1 ' + m.macro_f1.toFixed(2) : '') +
      (m.n_labeled_rows ? ' · ' + m.n_labeled_rows + ' labelled rows' : '');
  } else {
    b.className = 'badge provisional';
    b.innerHTML = 'Provisional — <b>rule engine</b>, no model trained yet';
  }
}

function drawFilters(counts) {
  document.getElementById('filters').innerHTML = ORDER.map(c => {
    const cls = c === 'PERSISTENT_SOURCE' ? 'f-persistent'
              : c === 'NEW_ABNORMAL_EVENT' ? 'f-abnormal' : 'f-other';
    return `<button class="${cls}" data-c="${c}" aria-pressed="true">
      <span class="n">${counts[c]}</span><span class="lbl">${SHORT[c]}</span></button>`;
  }).join('');
  document.querySelectorAll('#filters button').forEach(b => b.onclick = () => {
    const c = b.dataset.c;
    active.has(c) ? active.delete(c) : active.add(c);
    if (!active.size) ORDER.forEach(x => active.add(x));
    document.querySelectorAll('#filters button').forEach(x =>
      x.setAttribute('aria-pressed', active.has(x.dataset.c)));
    drawMarkers(); drawList();
  });
}

function drawMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  data.filter(h => active.has(h.classification)).forEach(h => {
    const m = L.circleMarker([h.latitude, h.longitude], {
      radius: 4 + (h.confidence || 0.5) * 5,
      color: COLOR[h.classification], weight: 1.5,
      fillColor: COLOR[h.classification], fillOpacity: 0.45,
    }).addTo(map);
    m.on('click', () => select(h.source_row_id, true));
    markers[h.source_row_id] = m;
  });
}

function drawList() {
  const rows = data
    .filter(h => active.has(h.classification))
    .sort((a, b) => ORDER.indexOf(a.classification) - ORDER.indexOf(b.classification)
                 || b.confidence - a.confidence);
  const el = document.getElementById('list');
  if (!rows.length) { el.innerHTML = '<div class="empty">No hotspots in this filter.</div>'; return; }
  el.innerHTML = rows.map(h => `
    <div class="row ${selected === h.source_row_id ? 'sel' : ''}" data-id="${h.source_row_id}">
      <span class="dot" style="background:${COLOR[h.classification]}"></span>
      <span>
        <span class="name">${SHORT[h.classification]}</span><br>
        <span class="meta">${h.latitude.toFixed(3)}, ${h.longitude.toFixed(3)} ·
          FRP ${h.raw.frp ?? '—'} · ${(h.acq_datetime || '').slice(0, 16)}</span>
      </span>
      <span class="conf">${Math.round(h.confidence * 100)}%</span>
      ${selected === h.source_row_id ? detailHTML(h) : ''}
    </div>`).join('');
  el.querySelectorAll('.row').forEach(r =>
    r.onclick = () => select(Number(r.dataset.id), false));
}

function detailHTML(h) {
  const factors = (h.key_factors || []).length
    ? h.key_factors.map(f => {
        const w = Math.min(50, Math.abs(f.contribution) * 22);
        const side = f.contribution > 0 ? 'pos' : 'neg';
        return `<div class="factor">
          <div class="fl"><span>${f.label}</span>
          <span>${f.value === null ? 'not available' : (+f.value).toPrecision(3)}</span></div>
          <div class="bar"><i class="${side}" style="width:${w}%"></i></div></div>`;
      }).join('')
    : '<p class="note" style="padding:0">Key factors appear once a model is trained — ' +
      'the rule engine gives the reason above instead.</p>';

  const raw = Object.entries(h.raw)
    .map(([k, v]) => `<tr><td>${k}</td><td>${v === null ? '—' : v}</td></tr>`).join('');

  const probs = h.probabilities
    ? '<table class="raw">' + Object.entries(h.probabilities)
        .map(([k, v]) => `<tr><td>${SHORT[k]}</td><td>${(v * 100).toFixed(1)}%</td></tr>`)
        .join('') + '</table>'
    : '';

  return `<div class="detail" onclick="event.stopPropagation()">
    <p>${h.explanation}</p>${probs}${factors}
    <table class="raw">${raw}</table></div>`;
}

function select(id, fromMap) {
  selected = selected === id ? null : id;
  drawList();
  if (selected) {
    const h = data.find(x => x.source_row_id === selected);
    if (!fromMap && h) map.setView([h.latitude, h.longitude], Math.max(map.getZoom(), 9));
    const r = document.querySelector('.row.sel');
    if (fromMap && r) r.scrollIntoView({ block: 'center' });
  }
}
</script>
</body>
</html>
