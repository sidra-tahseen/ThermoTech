services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: thermotech-backend
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thermotech-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend